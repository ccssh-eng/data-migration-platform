trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**  # déclenche seulement si terraform/ change

pool:
  vmImage: ubuntu-latest

variables:
  TF_VERSION: "1.15.5"
  WORKING_DIR: terraform

stages:

  # STAGE 1 : Validation 
  - stage: Validate
    displayName: "Terraform Validate & Plan"
    jobs:
      - job: TerraformPlan
        displayName: "Plan"
        steps:
          - task: AzureCLI@2
            displayName: "Setup Terraform"
            inputs:
              azureSubscription: "azure-connection"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Installer Terraform
                wget -O terraform.zip https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
                unzip terraform.zip
                sudo mv terraform /usr/local/bin/
                terraform version

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: "azure-connection"
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(WORKING_DIR)
              inlineScript: |
                terraform init

          - task: AzureCLI@2
            displayName: "Terraform Validate"
            inputs:
              azureSubscription: "azure-connection"
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(WORKING_DIR)
              inlineScript: |
                terraform validate

          - task: AzureCLI@2
            displayName: "Terraform Plan"
            inputs:
              azureSubscription: "azure-connection"
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(WORKING_DIR)
              inlineScript: |
                terraform plan \
                  -var="servicebus_connection_string=$(SERVICEBUS_CONNECTION_STRING)" \
                  -var="sql_server=$(SQL_SERVER)" \
                  -var="sql_database=$(SQL_DATABASE)" \
                  -var="acr_username=$(ACR_USERNAME)" \
                  -var="acr_password=$(ACR_PASSWORD)" \
                  -out=tfplan

          - publish: $(WORKING_DIR)/tfplan
            artifact: tfplan
            displayName: "Publier le plan"

  # STAGE 2 : Apply (approbation manuelle) 
  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        displayName: "Apply"
        environment: production  # approbation manuelle ici
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: tfplan

                - task: AzureCLI@2
                  displayName: "Terraform Apply"
                  inputs:
                    azureSubscription: "azure-connection"
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(WORKING_DIR)
                    inlineScript: |
                      terraform init
                      terraform apply -auto-approve \
                        -var="servicebus_connection_string=$(SERVICEBUS_CONNECTION_STRING)" \
                        -var="sql_server=$(SQL_SERVER)" \
                        -var="sql_database=$(SQL_DATABASE)" \
                        -var="acr_username=$(ACR_USERNAME)" \
                        -var="acr_password=$(ACR_PASSWORD)"
