name: CI-CD Data Migration Platforme

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]  # tester aussi sur les PRs

env:
  ACR_NAME: acr0cue2d
  IMAGE_WORKER: data-worker
  IMAGE_DLQ: dlq-monitor
  RESOURCE_GROUP: rg-data-migration

jobs:
  # --- JOB 1 : Tests unitaires --------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/ -v

  # --- JOB 2 : Build & Push ----------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test  # seulement si les tests passent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push Worker via ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_WORKER:${{ github.sha }} \
            --image $IMAGE_WORKER:latest \
            --file Dockerfile.worker .

      - name: Build & Push DLQ Monitor via ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_DLQ:${{ github.sha }} \
            --image $IMAGE_DLQ:latest \
            --file Dockerfile.dlq .

  # --- JOB 3 : Deploy -----------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push    # seulement si le build réussit
    environment: production  # approbation manuelle optionnelle
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Worker
        run: |
          az containerapp update \
            -g $RESOURCE_GROUP \
            -n worker-data-migration \
            --image $ACR_NAME.azurecr.io/$IMAGE_WORKER:${{ github.sha }}

      - name: Deploy DLQ Monitor
        run: |
          az containerapp update \
            -g $RESOURCE_GROUP \
            -n dlq-monitor-data-migration \
            --image $ACR_NAME.azurecr.io/$IMAGE_DLQ:${{ github.sha }}

      - name: Vérifier le déploiement
        run: |
          az containerapp revision list \
            -g $RESOURCE_GROUP \
            -n worker-data-migration \
            --query "[?properties.active].{nom: name, etat: properties.healthState}" \
            --output table


  # --- JOB 4 : Terraform (infra) -------------------------
  terraform:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_servicebus_connection_string: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          TF_VAR_sql_server: ${{ secrets.SQL_SERVER }}
          TF_VAR_sql_database: ${{ secrets.SQL_DATABASE }}
          TF_VAR_acr_username: ${{ secrets.ACR_USERNAME }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_servicebus_connection_string: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          TF_VAR_sql_server: ${{ secrets.SQL_SERVER }}
          TF_VAR_sql_database: ${{ secrets.SQL_DATABASE }}
          TF_VAR_acr_username: ${{ secrets.ACR_USERNAME }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}

