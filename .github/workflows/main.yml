name: CI-CD Data Migration Platforme

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]  # tester aussi sur les PRs

env:
  ACR_NAME: acr0cue2d
  IMAGE_WORKER: data-worker
  IMAGE_DLQ: dlq-monitor
  RESOURCE_GROUP: rg-data-migration

jobs:
  # --- JOB 1 : Tests unitaires --------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # --- JOB 2 : Build & Push ----------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test  # seulement si les tests passent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push Worker via ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_WORKER:${{ github.sha }} \
            --image $IMAGE_WORKER:latest \
            --file Dockerfile.worker .

      - name: Build & Push DLQ Monitor via ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_DLQ:${{ github.sha }} \
            --image $IMAGE_DLQ:latest \
            --file Dockerfile.dlq .

  # --- JOB 3 : Deploy -----------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push    # seulement si le build réussit
    environment: production  # approbation manuelle optionnelle
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Worker
        run: |
          az containerapp update \
            -g $RESOURCE_GROUP \
            -n worker-data-migration \
            --image $ACR_NAME.azurecr.io/$IMAGE_WORKER:${{ github.sha }}

      - name: Deploy DLQ Monitor
        run: |
          az containerapp update \
            -g $RESOURCE_GROUP \
            -n dlq-monitor-data-migration \
            --image $ACR_NAME.azurecr.io/$IMAGE_DLQ:${{ github.sha }}

      - name: Vérifier le déploiement
        run: |
          az containerapp revision list \
            -g $RESOURCE_GROUP \
            -n worker-data-migration \
            --query "[?properties.active].{nom: name, etat: properties.healthState}" \
            --output table

